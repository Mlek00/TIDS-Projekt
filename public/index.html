<!doctype html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <title>Izleti in turistična statistika</title>
</head>
<body>
    <h1>Turistična statistika za načrtovanje izletov</h1>

    <label for="kraj">Kraj:</label>
    <select id="kraj"></select>

    <label for="meritev">Meritev:</label>
    <select id="meritev">
        <option value="Prihodi turistov">Prihodi turistov</option>
        <option value="Prenočitve turistov">Prenočitve turistov</option>
    </select>

    <p id="status">Pripravljeno za prikaz podatkov.</p>
    <canvas id="graf"></canvas>

    <h2>Izleti v izbranem kraju</h2>
    <p id="statusIzletov"></p>
    <ul id="seznamIzletov"></ul>

    <h2>Vremenska napoved</h2>
    <p id="statusNapovedi"></p>
    <ul id="seznamNapovedi"></ul>

    <h2>Predlog izleta</h2>
    <p>Za priporočilo uporabi kraj, izbran nad grafom.</p>

    <form id="obrazecPriporocil">
        <label for="datumIzleta">Datum izleta:</label>
        <input id="datumIzleta" type="date" required>

        <label for="zeljeIzleta">Kaj si želiš?</label>
        <textarea
            id="zeljeIzleta"
            rows="3"
            maxlength="300"
            placeholder="Na primer: lahek izlet z otroki"
            required
        ></textarea>

        <button type="submit">Predlagaj izlet</button>
    </form>

    <p id="statusDnevneNapovedi">Izberi datum za prikaz dnevne napovedi.</p>
    <p id="dnevnaNapoved"></p>

<p id="statusPriporocila"></p>
<div id="rezultatPriporocila"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script>
    const izborKraja = document.getElementById("kraj");
    const statusElement = document.getElementById("status");
    let statistika = [];
    const izborMeritve = document.getElementById("meritev");
    let graf;

    function narisiGraf() {
    const kraj = izborKraja.value;
    const meritev = izborMeritve.value;

    const izbraniZapisi = statistika.filter(zapis =>
        zapis.kraj === kraj && zapis.meritev === meritev
    );

    const leta = [...new Set(izbraniZapisi.map(zapis => zapis.leto))]
        .sort((a, b) => a - b);

    function vrednostiZa(vrstaTurista) {
        return leta.map(leto =>
            izbraniZapisi.find(zapis =>
                zapis.leto === leto &&
                zapis.vrstaTurista === vrstaTurista
            )?.vrednost ?? null
        );
    }

        if (graf) {
            graf.destroy();
        }

        graf = new Chart(document.getElementById("graf"), {
            type: "line",
            data: {
                labels: leta,
                datasets: [
                    {
                        label: "Domači",
                        data: vrednostiZa("Domači"),
                        borderColor: "#2563eb",
                        spanGaps: false
                    },
                    {
                        label: "Tuji",
                        data: vrednostiZa("Tuji"),
                        borderColor: "#ea580c",
                        spanGaps: false
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: `${meritev} – ${kraj}`
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: "Število"
                        }
                    }
                }
            }
        });
    }

    
    const obrazecPriporocil = document.getElementById("obrazecPriporocil");
    const statusPriporocila = document.getElementById("statusPriporocila");
    const rezultatPriporocila = document.getElementById("rezultatPriporocila");
    const gumbPriporocil = obrazecPriporocil.querySelector('button[type="submit"]');

    obrazecPriporocil.addEventListener("submit", async (dogodek) => {
    dogodek.preventDefault();

    const vnos = {
        kraj: izborKraja.value,
        datum: document.getElementById("datumIzleta").value,
        zelje: document.getElementById("zeljeIzleta").value.trim()
    };

    if (!vnos.kraj || !vnos.datum || !vnos.zelje) {
        statusPriporocila.textContent = "Izberi kraj, datum in vpiši željo.";
        return;
    }

    rezultatPriporocila.replaceChildren();
    statusPriporocila.textContent = "Pripravljam priporočilo ...";
    gumbPriporocil.disabled = true;

    try {
        const odgovor = await fetch("/api/priporocila", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(vnos)
        });

        const podatki = await odgovor.json();

        if (!odgovor.ok) {
            throw new Error(podatki.napaka || `HTTP ${odgovor.status}`);
        }

        const povzetek = document.createElement("p");
        povzetek.textContent = podatki.priporocilo.povzetek;
        rezultatPriporocila.append(povzetek);

        const seznam = document.createElement("ul");

        for (const predlog of podatki.priporocilo.predlogi) {
            const izlet = podatki.kontekst.izleti.find(
                i => i.id === predlog.izletId
            );

            const vrstica = document.createElement("li");
            vrstica.textContent =
                `${izlet?.naziv ?? predlog.izletId}: ` +
                `${predlog.razlog} Nasvet: ${predlog.nasvet}`;

            seznam.append(vrstica);
        }

        rezultatPriporocila.append(seznam);
        statusPriporocila.textContent = "Priporočilo je pripravljeno.";
    } catch (napaka) {
        console.error(napaka);
        statusPriporocila.textContent = napaka.message;
    } finally {
        gumbPriporocil.disabled = false;
    }
});

    const statusIzletov = document.getElementById("statusIzletov");
    const seznamIzletov = document.getElementById("seznamIzletov");
    let zadnjaIzbiraIzletov = 0;

    async function naloziIzlete() {
    const stevilkaIzbire = ++zadnjaIzbiraIzletov;
    const krajId = statistika.find(
        zapis => zapis.kraj === izborKraja.value
    )?.krajId;

    seznamIzletov.replaceChildren();

    if (!krajId) {
        statusIzletov.textContent = "Za ta kraj ni podatkov.";
        return;
    }

    statusIzletov.textContent = "Nalagam izlete ...";

    try {
        const odgovor = await fetch(
            `/api/grpc/izleti?krajId=${encodeURIComponent(krajId)}`,
            { cache: "no-store" }
        );
        const podatki = await odgovor.json();

        if (stevilkaIzbire !== zadnjaIzbiraIzletov) return;
        if (!odgovor.ok) {
            throw new Error(podatki.napaka || `HTTP ${odgovor.status}`);
        }

        for (const izlet of podatki.izleti) {
            const vrstica = document.createElement("li");
            vrstica.textContent =
                `${izlet.naziv} – ${izlet.vrsta}, ` +
                `${izlet.trajanje_ur} h, oprema: ${izlet.oprema}`;
            seznamIzletov.append(vrstica);
        }

        statusIzletov.textContent =
            `Najdenih izletov: ${podatki.izleti.length}`;
    } catch (napaka) {
        if (stevilkaIzbire !== zadnjaIzbiraIzletov) return;
        console.error(napaka);
        statusIzletov.textContent = "Izletov ni bilo mogoče naložiti.";
    }
}
    const statusNapovedi = document.getElementById("statusNapovedi");
    const seznamNapovedi = document.getElementById("seznamNapovedi");
    let trenutniTokNapovedi = null;

function naloziNapovedi() {
    if (trenutniTokNapovedi) {
        trenutniTokNapovedi.close();
    }

    const krajId = statistika.find(
        zapis => zapis.kraj === izborKraja.value
    )?.krajId;

    seznamNapovedi.replaceChildren();

    if (!krajId) {
        statusNapovedi.textContent = "Izberi kraj.";
        trenutniTokNapovedi = null;
        return;
    }

    statusNapovedi.textContent = "Nalagam napovedi ...";

    const tok = new EventSource(
        `/api/grpc/napovedi?krajId=${encodeURIComponent(krajId)}`
    );
    trenutniTokNapovedi = tok;
    let prejetih = 0;

    tok.onmessage = dogodek => {
        if (trenutniTokNapovedi !== tok) return;

        const napoved = JSON.parse(dogodek.data);
        const vrstica = document.createElement("li");

        vrstica.textContent =
            `${napoved.datum}: ${napoved.temperatura_max} °C, ` +
            `${napoved.padavine_mm} mm padavin, ` +
            `${napoved.veter_kmh} km/h veter`;

        seznamNapovedi.append(vrstica);
        prejetih++;
        statusNapovedi.textContent = `Prejetih napovedi: ${prejetih}`;
    };

    tok.addEventListener("konec", () => {
        if (trenutniTokNapovedi !== tok) return;

        statusNapovedi.textContent =
            `Naloženih napovedi: ${prejetih}`;
        tok.close();
        trenutniTokNapovedi = null;
    });

    tok.addEventListener("napaka", dogodek => {
        if (trenutniTokNapovedi !== tok) return;

        const podatki = JSON.parse(dogodek.data);
        statusNapovedi.textContent = podatki.napaka;
        tok.close();
        trenutniTokNapovedi = null;
    });

    tok.onerror = () => {
        if (trenutniTokNapovedi !== tok) return;

        statusNapovedi.textContent =
            "Povezava za vremenske napovedi ni uspela.";
        tok.close();
        trenutniTokNapovedi = null;
    };
}

    const vnosDatuma = document.getElementById("datumIzleta");
    const statusDnevneNapovedi =
        document.getElementById("statusDnevneNapovedi");
    const dnevnaNapoved = document.getElementById("dnevnaNapoved");
    let zadnjiZahtevekDneva = 0;

    async function naloziDnevnoNapoved() {
    const stevilkaZahtevka = ++zadnjiZahtevekDneva;
    const datum = vnosDatuma.value;
    const krajId = statistika.find(
        zapis => zapis.kraj === izborKraja.value
    )?.krajId;

    dnevnaNapoved.textContent = "";

    if (!datum) {
        statusDnevneNapovedi.textContent =
            "Izberi datum za prikaz dnevne napovedi.";
        return;
    }

    if (!krajId) {
        statusDnevneNapovedi.textContent = "Najprej izberi kraj.";
        return;
    }

    statusDnevneNapovedi.textContent = "Nalagam dnevno napoved ...";

    try {
        const parametri = new URLSearchParams({ krajId, datum });
        const odgovor = await fetch(
            `/api/grpc/napoved?${parametri}`,
            { cache: "no-store" }
        );
        const napoved = await odgovor.json();

        if (stevilkaZahtevka !== zadnjiZahtevekDneva) return;
        if (!odgovor.ok) {
            throw new Error(napoved.napaka || `HTTP ${odgovor.status}`);
        }

        dnevnaNapoved.textContent =
            `${napoved.datum}: ${napoved.temperatura_max} °C, ` +
            `${napoved.padavine_mm} mm padavin, ` +
            `${napoved.veter_kmh} km/h veter`;

        statusDnevneNapovedi.textContent =
            `Napoved za ${izborKraja.value}:`;
    } catch (napaka) {
        if (stevilkaZahtevka !== zadnjiZahtevekDneva) return;
        console.error(napaka);
        statusDnevneNapovedi.textContent = napaka.message;
    }
}

    async function naloziPodatke() {
    statusElement.textContent = "Nalagam podatke ...";

    try {
        const [odgovorTurizem, odgovorKraji] = await Promise.all([
            fetch("/api/turizem", { cache: "no-store" }),
            fetch("/api/grpc/kraji", { cache: "no-store" })
        ]);

        if (!odgovorTurizem.ok || !odgovorKraji.ok) {
            throw new Error("Podatkov ni bilo mogoče pridobiti.");
        }

        const [podatkiTurizem, podatkiKraji] = await Promise.all([
            odgovorTurizem.json(),
            odgovorKraji.json()
        ]);

        statistika = podatkiTurizem.statistika;

        const kraji = podatkiKraji.kraji.sort(
            (a, b) => a.ime.localeCompare(b.ime, "sl")
        );

        izborKraja.replaceChildren();

        for (const kraj of kraji) {
            const moznost = document.createElement("option");
            moznost.value = kraj.ime;
            moznost.textContent = kraj.ime;
            izborKraja.append(moznost);
        }

        statusElement.textContent =
            `Naloženih ${statistika.length} statističnih zapisov ` +
            `in ${kraji.length} krajev.`;

        narisiGraf();
        naloziIzlete();
        naloziNapovedi();
        naloziDnevnoNapoved();
    } catch (napaka) {
        console.error(napaka);
        statusElement.textContent = "Podatkov ni bilo mogoče naložiti.";
    }
}

    izborKraja.addEventListener("change", () => {
    narisiGraf();
    naloziIzlete();
    naloziNapovedi();
    naloziDnevnoNapoved();
});
    izborMeritve.addEventListener("change", narisiGraf);
    vnosDatuma.addEventListener("change", naloziDnevnoNapoved);

    naloziPodatke();
    
    </script>
</body>
</html>
